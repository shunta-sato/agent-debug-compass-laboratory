project: agent-debug-compass-laboratory
status: draft
budget_status: provisional

rules:
  no_measurement_no_claim: true
  battery_unknown_is_not_ac: true
  measurement_unknown_is_not_pass: true
  host_fallback_is_not_target_proof: true
  production_ready_requires_physical_evidence: true

target_classes:
  - name: raspberry_pi_4
    profile: target_profiles/raspberry_pi_4.yaml
    default_budgets:
      default_polling_interval_ms_min: 1000
      default_sampling_rate_hz_max: 1
      always_on_polling_below_100ms_allowed: false
      high_frequency_default_polling_requires_measurement: true
      steady_state_cpu_percent_max: null
      wakeups_per_second_added_max: null
      rss_mb_max: null
      continuous_disk_write_bytes_per_second_max: 0
      thermal_rise_celsius_max: null
    burst_budgets:
      burst_sampling_interval_ms_min: 1000
      cpu_load_safety_monitor_interval_ms: 100
      burst_duration_seconds_max: 300
      burst_requires_trigger_or_marker: true
      operator_abort_supported_for_cpu_load: true
      cpu_load_restore_on_abort_status: not_required
      experiment_runner_supported_order: listed
      experiment_runner_supported_controlled_factors:
        - cpu_load_workers
      experiment_runner_warmup_seconds_max: 60
      experiment_runner_cooldown_seconds_max: 60
      experiment_runner_repetitions_max: 10
      experiment_runner_expanded_trials_max: 64
      operating_point_coverage_report_target_runtime: none
      operating_point_coverage_statuses:
        - observational_only
        - controlled_subset
        - controlled_full
        - not_controllable
        - blocked_unsafe
      capability_cost_report_target_runtime: none
      capability_cost_blocks_architecture_recommendations_without_cost_evidence: true
      agent_adapter_qualification_target_runtime: none
      agent_adapter_qualification_executes_adapter: false
      agent_adapter_qualification_duration_seconds_max: 30
      agent_adapter_qualification_output_bytes_max: 1048576

degraded_modes:
  battery_low: experimental-only until target policy is characterized
  memory_pressure: bound outputs and fail closed
  thermal_pressure: abort bounded load when configured threshold is reached
  operator_abort: stop bounded CPU load when target-local abort marker is observed
  storage_pressure: stop writing run artifacts or fail closed
  measurement_unavailable: mark feature experimental or remove production claims

budget_provenance_defaults:
  source: placeholder_unknown
  confidence: unknown
  evidence: []
  production_claim_allowed: false
  next_step: Run embedded-target-characterization before finalizing production budgets.
