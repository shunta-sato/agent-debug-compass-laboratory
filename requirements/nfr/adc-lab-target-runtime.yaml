feature: adc-lab-target-runtime
target_class: raspberry_pi_4
status: partially_measured_target55_experimental_only

rules:
  no_measurement_no_claim: true
  battery_unknown_is_not_ac: true
  measurement_unknown_is_not_pass: true
  host_fallback_is_not_target_proof: true

modes:
  default:
    description: No always-on target-local runtime in MVP.
    default_polling_interval_ms_min: 1000
    default_sampling_rate_hz_max: 1
    always_on_polling_below_100ms_allowed: false
    high_frequency_default_polling_requires_measurement: true
    steady_state_cpu_percent_max: null
    wakeups_per_second_added_max: null
    rss_mb_max: null
    heap_growth_mb_per_hour_max: 0
    hot_path_allocations_per_iteration_max: 0
    continuous_disk_write_bytes_per_second_max: 0
    flash_write_bytes_per_day_max: null
    network_background_bytes_per_hour_max: 0
    battery_drain_percent_per_hour_max: null
    latency_jitter_ms_p99_max: null
    thermal_rise_celsius_max: null
    observer_overhead_percent_max: null
  burst:
    description: Command-triggered observation or CPU load.
    trigger: explicit operator command
    burst_sampling_interval_ms_min: 1000
    cpu_load_safety_monitor_interval_ms: 100
    burst_duration_seconds_max: 300
    duration_seconds_max: 300
    burst_requires_trigger_or_marker: true
    operator_abort_supported_for_cpu_load: true
    cpu_load_restore_on_abort_status: not_required
    cpu_percent_max: null
    wakeups_per_second_added_max: null
    disk_write_bytes_total_max: null
  experimental:
    production_ready_claim_allowed: false
    reason: target55 short-smoke evidence exists, but production physical-footprint evidence is incomplete.

degraded_modes:
  battery_low: remove battery claims and require target policy before use
  memory_pressure: fail closed or reduce output volume
  thermal_pressure: abort load when threshold is configured and reached
  operator_abort: stop bounded CPU load when the target-local abort marker is observed
  storage_pressure: fail closed before unbounded writes
  measurement_unavailable: remove claims or mark experimental

measurement:
  target_command_smoke: ADC_LAB_TARGET_RUNNER=/home/demo/.local/bin/adc-lab-target scripts/resource/run-resource-smoke.sh --target ssh://target55
  host_fallback_command_smoke: scripts/resource/run-resource-smoke.sh --host-fallback
  command_smoke_resource_metrics_collected: false
  pr5_operator_abort_contract_verified_by: cargo test -p adc-lab --test cli load_cpu_operator_abort_records_safety_monitor_without_abort_path
  baseline_path: examples/demos/target55/baselines/resource/idle.json
  report_path: examples/demos/target55/reports/target-characterization.json
  missing_evidence:
    - wakeup measurement
    - battery/power measurement
    - storage write and flash-wear measurement
    - latency/jitter measurement
    - sustained thermal and recovery envelope

budget_provenance:
  default_polling_interval_ms_min:
    source: measured
    evidence:
      - docs/nfr/adc-lab-target-runtime.md
      - lab/runs/LAB-RUN-target55-idle-only-observe/observations/observe.json
    confidence: medium
    rationale: target55 observe smoke used 1s sampling and completed.
    revisit_when:
      - sub-1s default sampling is introduced
      - target runner or observer implementation changes
  burst_duration_seconds_max:
    source: measured
    evidence:
      - requirements/physical_budgets.yaml
      - lab/runs/LAB-RUN-target55-load-observer-off/loads/LOAD-1edfd5ff-ce11-4f6c-bc14-3b56ecc0b1b6.result.json
    confidence: medium
    rationale: target55 10s bounded CPU load completed below configured 75C abort.
    revisit_when:
      - Tier 3 sustained stress is implemented
      - load duration, worker count, or abort threshold changes
